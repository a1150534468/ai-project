server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 带 hash 的静态资源：长期不可变缓存
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA 入口：禁缓存，发版后浏览器立即拿到新 index.html → 新 hash 资源
  location / {
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }
}
