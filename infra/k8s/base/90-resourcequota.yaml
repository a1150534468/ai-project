apiVersion: v1
kind: ResourceQuota
metadata:
  name: ai-assistant-quota
  namespace: ai-assistant
spec:
  hard:
    # API HPA 满副本 + 两个小说 Worker + Worker/API 滚动发布需要并存空间。
    requests.cpu: "6"
    requests.memory: 8Gi
    # limits 留 headroom：API HPA 与小说 Worker 同时 surge 时仍可完成滚动发布。
    limits.cpu: "20"
    limits.memory: 18Gi
    pods: "30"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ai-assistant-limits
  namespace: ai-assistant
spec:
  limits:
    - type: Container
      default: { cpu: "500m", memory: 512Mi }
      defaultRequest: { cpu: "100m", memory: 128Mi }
