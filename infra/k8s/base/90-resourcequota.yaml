apiVersion: v1
kind: ResourceQuota
metadata:
  name: ai-assistant-quota
  namespace: ai-assistant
spec:
  hard:
    # API HPA 满副本、两个小说 Worker、Codex 桌宠 Worker 与迁移 Job
    # 的稳态 requests 已超过 8Gi。这里同时为各 Deployment 的滚动
    # surge 留空间，避免新增桌宠 Worker 后发版卡在 ResourceQuota。
    requests.cpu: "10"
    requests.memory: 14Gi
    limits.cpu: "24"
    limits.memory: 28Gi
    pods: "30"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ai-assistant-limits
  namespace: ai-assistant
spec:
  limits:
    - type: Container
      default: { cpu: "500m", memory: 512Mi }
      defaultRequest: { cpu: "100m", memory: 128Mi }
