apiVersion: v1
kind: ResourceQuota
metadata:
  name: ai-assistant-quota
  namespace: ai-assistant
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    # limits 留 headroom：api HPA 满副本(6)叠加滚动 surge 时 limits.cpu 峰值 ~8.5，避免被配额挡住 surge 致发布卡住
    limits.cpu: "10"
    limits.memory: 18Gi
    pods: "30"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ai-assistant-limits
  namespace: ai-assistant
spec:
  limits:
    - type: Container
      default: { cpu: "500m", memory: 512Mi }
      defaultRequest: { cpu: "100m", memory: 128Mi }
