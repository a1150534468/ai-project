apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-business-promo-worker
  namespace: yunclaude
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-business-promo-worker
  template:
    metadata:
      labels:
        app: local-business-promo-worker
    spec:
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: image-pull-secret-placeholder
      containers:
        - name: local-business-promo-worker
          image: yc-api
          command:
            - pnpm
            - --filter
            - "@yc/api"
            - exec
            - tsx
            - src/workers/local-business-promo-worker.ts
          envFrom:
            - configMapRef:
                name: yc-api-config
            - secretRef:
                name: yc-api-secrets
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
              ephemeral-storage: "4Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
              ephemeral-storage: "8Gi"
