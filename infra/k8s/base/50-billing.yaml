apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing
  namespace: ai-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate   # recon.Reconcile 每5min跑于进程内，多副本会重复退款；单例+Recreate 规避
  selector:
    matchLabels: { app: billing }
  template:
    metadata:
      labels: { app: billing }
    spec:
      imagePullSecrets:
        - name: image-pull-secret-placeholder
      containers:
        - name: billing
          image: ai-assistant-billing
          ports:
            - containerPort: 8093
          envFrom:
            - configMapRef: { name: ai-assistant-billing-config }
            - secretRef: { name: ai-assistant-billing-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8093 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8093 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: billing
  namespace: ai-assistant
spec:
  selector: { app: billing }
  ports:
    - name: http
      port: 8093
      targetPort: 8093
