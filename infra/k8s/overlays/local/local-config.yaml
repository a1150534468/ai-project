apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-assistant-api-config
  namespace: ai-assistant
data:
  NODE_ENV: "production"
  PORT: "8090"
  API_DOCS_ENABLED: "true"
  LLM_PROVIDER: "bailian"
  BAILIAN_REGION: "cn-beijing"
  LLM_DEFAULT_MODEL: "qwen3.7-plus"
  CHAT_MULTIMODAL_MODEL: "qwen3.7-plus"
  CORS_ORIGIN: "http://app.localhost:8080,http://admin.localhost:8080"
  # 同一 COS 桶，本地环境落在 dev/ 文件夹（AK/SK 由 Secret 注入）。
  S3_ENDPOINT: "https://cos.ap-guangzhou.myqcloud.com"
  S3_REGION: "ap-guangzhou"
  S3_BUCKET: "aiproject-assets-1250000000"
  S3_PUBLIC_BASE_URL: "https://assets.example.com"
  S3_FORCE_PATH_STYLE: "false"
  S3_KEY_PREFIX: "dev"
