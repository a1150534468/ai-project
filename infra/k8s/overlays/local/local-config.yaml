apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-assistant-api-config
  namespace: ai-assistant
data:
  NODE_ENV: "production"
  PORT: "8090"
  API_DOCS_ENABLED: "true"
  LLM_PROVIDER: "bailian"
  BAILIAN_REGION: "cn-beijing"
  LLM_DEFAULT_MODEL: "qwen3.7-plus"
  CHAT_MULTIMODAL_MODEL: "qwen3.7-plus"
  BILLING_BASE_URL: "http://billing:8093"
  CORS_ORIGIN: "http://app.localhost:8080,http://admin.localhost:8080"
  S3_ENDPOINT: "http://host.docker.internal:9000"
  S3_REGION: "us-east-1"
  S3_BUCKET: "ai-assistant-local"
  S3_PUBLIC_BASE_URL: "http://localhost:9000/ai-assistant-local"
  S3_FORCE_PATH_STYLE: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-assistant-billing-config
  namespace: ai-assistant
data:
  BILLING_PORT: "8093"
  BILLING_PRICING_MODE: "learning"
  EPAY_GATEWAY: ""
  PUBLIC_CALLBACK_BASE: "http://api.localhost:8080"
