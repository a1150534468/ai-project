apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: ai-assistant
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  tls: null
  rules:
    - host: app.localhost
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port: { number: 8090 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: { number: 80 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin
  namespace: ai-assistant
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  tls: null
  rules:
    - host: admin.localhost
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port: { number: 8090 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin
                port: { number: 80 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: ai-assistant
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  tls: null
  rules:
    - host: api.localhost
      http:
        paths:
          - path: /api/billing/epay
            pathType: Prefix
            backend:
              service:
                name: billing
                port: { number: 8093 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port: { number: 8090 }
