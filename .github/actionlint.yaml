# actionlint 的配置。
#
# 目前**没有自建 runner**：所有 workflow（production.yml / ci.yml /
# production-diagnostics.yml）都跑在 GitHub 托管 runner 上，因此
# self-hosted-runner.labels 是空的。以后若重新引入自建 runner，必须把它的标签写在下面，
# 否则 actionlint 会把 runs-on 里的自定义标签判成未知标签。
#
# 2026-10-13~14 这段反复值得留档，因为它记录的是一条**被证伪的推论**：
#   · 10-13 把 images 从托管 runner 换到自建 Mac（标签 release-mac），理由是
#     「托管 runner 出境到 TCR 只有 17 KB/s，api 的 522 MB 归档要几小时，必然超时」。
#   · 10-14 把这份账逐层算清了才发现那条理由站不住：**关键从来不是 runner 快慢，
#     而是每轮真正要出境的字节**。只改 apps/api 的一轮只出境 0.56 MiB（≈35 秒）；
#     10-13 那轮之所以推了约 100 MiB，是因为同一个提交还改了 Dockerfile，
#     逼着 77.1 MiB 与 18.3 MiB 两层一起重推。**那是特例，不是规律。**
#   · 结论：换回 ubuntu-latest，形态与 blog 的 build job 对齐，标签清空。
#     逐层字节账见 docs/deploy-compose.md 第 5 节。
self-hosted-runner:
  labels: []
