name: Verify and deploy production

on:
  # 只在打 tag 或手动触发时跑。原来是「push 到 main 就跑」，于是每次 push 都要把
  # ci.yml 刚跑过的 typecheck + 全量测试再跑一遍，再接着 build 4 个镜像并部署一次
  # 生产 —— 一次 push 约 50 个计费分钟。Free 计划每月 2000 分钟只够 40 次，
  # 2026-08 就是这么在 08-27 把额度用光，之后每个 job 都以「The job was not started
  # because ... spending limit」直接不启动，连着红了三天。
  #
  # 随之而来的约定：**tag 只打在 main 上 CI 已经绿灯的 commit 上**。ci.yml 的触发条件
  # 是 push 到分支，而 tag push 不算分支，所以本工作流跑起来时那个 commit 不会再有
  # 一次 CI —— 它的测试结论来自它当初在 main 上那一次。想额外保一道，就对着 tag 手动
  # 触发一次 ci.yml 的 workflow_dispatch。
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    # 20 分钟够跑完（实测 verify 瘦身后 ~6 分钟）。压低上限是为了防「卡住的 job
    # 一个人吃掉 45 分钟额度」——额度是按 job 实际墙钟时间向上取整计费的。
    timeout-minutes: 20
    services:
      # 只留 billing 自己的库：go test ./... 要连它。pgvector 和 redis 是给
      # pnpm test 用的，测试已挪回 ci.yml，这两个 service 一起删掉——service 容器
      # 的拉起时间也算在 job 计费里。
      billing-postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ai_assistant_billing
          POSTGRES_PASSWORD: ci-billing-password
          POSTGRES_DB: ai_assistant_billing
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U ai_assistant_billing -d ai_assistant_billing"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # 同理，这里只保留 Go 侧真正读的两个 DSN。原来那串 DATABASE_URL / REDIS_URL /
      # SESSION_SECRET / LLM_* 全是 JS 测试的入参，Go 代码里一个都不读
      # （services/billing 全量 grep 无 DATABASE_URL / REDIS / ffmpeg）。
      # BILLING_BASE_URL 也不需要：服务自己 envOr("BILLING_PORT", "8093")，
      # 下面 smoke 步骤直接 curl 8093。
      BILLING_DATABASE_URL: postgresql://ai_assistant_billing:ci-billing-password@127.0.0.1:5434/ai_assistant_billing
      BILLING_TEST_DATABASE_URL: postgresql://ai_assistant_billing:ci-billing-password@127.0.0.1:5434/ai_assistant_billing
      BILLING_INTERNAL_TOKEN: ci-billing-token
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/billing/go.mod
          cache-dependency-path: services/billing/go.sum
      - run: pnpm install --frozen-lockfile
      # 刻意不再跑 pnpm typecheck / pnpm test --force：同一个 commit 在 main 上已经
      # 被 ci.yml 跑过（见文件顶部「tag 只打绿灯 commit」的约定），再跑一遍只是花
      # 双倍额度买同一个结论。跟着一起删的是 Install ffmpeg 和 prisma migrate
      # deploy —— 那两步只为 pnpm test 存在（ffmpeg 决定 8 个用例是真跑还是静默跳）。
      #
      # 留下 pnpm build 是因为 ci.yml 里没有 build 步骤，全仓只有这里会真的过一遍
      # vite / electron 打包。代价写明：**打不出包这件事从此只在打 tag 时才暴露**。
      # 想在 push 阶段就拦住，得往 ci.yml 加 build，那是每次 push 再多几分钟。
      - run: pnpm build
      - run: go test ./...
        working-directory: services/billing
      - name: Smoke test Billing service
        working-directory: services/billing
        run: |
          go run . >/tmp/billing.log 2>&1 &
          billing_pid=$!
          trap 'kill "$billing_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8093/health; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/billing.log
          exit 1

  images:
    # 原来这里有 `if: github.event_name != 'pull_request'`，是为了让 PR 只验证不
    # 发布。现在触发条件里已经没有 pull_request，这个判断恒为真，删掉免得误读成
    # 「还有某种情况不发布」。
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      max-parallel: 1
      matrix:
        include:
          - name: api
            context: .
            file: infra/docker/api/Dockerfile
            build_args: |
              USE_CHINA_APT_MIRROR=false
              NPM_CONFIG_REGISTRY=https://registry.npmjs.org
              PRISMA_ENGINES_MIRROR=https://binaries.prisma.sh
          - name: billing
            context: services/billing
            file: infra/docker/billing/Dockerfile
            build_args: ""
          - name: migrate
            context: .
            file: infra/docker/migrate/Dockerfile
            build_args: |
              USE_CHINA_APT_MIRROR=false
              NPM_CONFIG_REGISTRY=https://registry.npmjs.org
              PRISMA_ENGINES_MIRROR=https://binaries.prisma.sh
          - name: gateway
            context: .
            file: infra/docker/gateway/Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@v4
      - name: Limit concurrent registry uploads
        run: |
          daemon_config="$(mktemp)"
          if sudo test -f /etc/docker/daemon.json; then
            sudo cat /etc/docker/daemon.json \
              | jq '. + {"max-concurrent-uploads": 1}' > "$daemon_config"
          else
            jq -n '{"max-concurrent-uploads": 1}' > "$daemon_config"
          fi
          sudo install -m 0644 "$daemon_config" /etc/docker/daemon.json
          sudo systemctl restart docker
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build_args }}
          load: true
          tags: ${{ secrets.REGISTRY }}/${{ secrets.IMAGE_NAMESPACE }}/ai-assistant-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Push image to TCR
        env:
          IMAGE_REF: ${{ secrets.REGISTRY }}/${{ secrets.IMAGE_NAMESPACE }}/ai-assistant-${{ matrix.name }}:${{ github.sha }}
        run: |
          for attempt in 1 2 3; do
            if timeout --signal=TERM 45m docker push "$IMAGE_REF"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Upload deployment manifests
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
        run: |
          ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_ROOT/infra/caddy'"
          scp -P "${DEPLOY_PORT:-22}" docker-compose.prod.yml scripts/remote-deploy.sh scripts/rollback-compose.sh scripts/profile-resources.sh scripts/install-host-caddy.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/"
          scp -P "${DEPLOY_PORT:-22}" infra/caddy/ai-assistant.caddy "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/infra/caddy/"
      - name: Deploy verified image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
        run: |
          ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_ROOT='$DEPLOY_ROOT' bash '$DEPLOY_ROOT/remote-deploy.sh' '${{ github.sha }}'"
