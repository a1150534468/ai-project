name: Verify and deploy production

on:
  # 只在打 tag 或手动触发时跑。原来是「push 到 main 就跑」，于是每次 push 都要把
  # ci.yml 刚跑过的 typecheck + 全量测试再跑一遍，再接着 build 4 个镜像并部署一次
  # 生产 —— 一次 push 约 50 个计费分钟。Free 计划每月 2000 分钟只够 40 次，
  # 2026-08 就是这么在 08-27 把额度用光，之后每个 job 都以「The job was not started
  # because ... spending limit」直接不启动，连着红了三天。
  #
  # 随之而来的约定：**tag 只打在 main 上 CI 已经绿灯的 commit 上**。ci.yml 的触发条件
  # 是 push 到分支，而 tag push 不算分支，所以本工作流跑起来时那个 commit 不会再有
  # 一次 CI —— 它的测试结论来自它当初在 main 上那一次。想额外保一道，就对着 tag 手动
  # 触发一次 ci.yml 的 workflow_dispatch。
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    # 20 分钟够跑完（实测 verify 瘦身后 ~6 分钟）。压低上限是为了防「卡住的 job
    # 一个人吃掉 45 分钟额度」——额度是按 job 实际墙钟时间向上取整计费的。
    timeout-minutes: 20
    services:
      # 只留 billing 自己的库：go test ./... 要连它。pgvector 和 redis 是给
      # pnpm test 用的，测试已挪回 ci.yml，这两个 service 一起删掉——service 容器
      # 的拉起时间也算在 job 计费里。
      billing-postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ai_assistant_billing
          POSTGRES_PASSWORD: ci-billing-password
          POSTGRES_DB: ai_assistant_billing
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U ai_assistant_billing -d ai_assistant_billing"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # 同理，这里只保留 Go 侧真正读的两个 DSN。原来那串 DATABASE_URL / REDIS_URL /
      # SESSION_SECRET / LLM_* 全是 JS 测试的入参，Go 代码里一个都不读
      # （services/billing 全量 grep 无 DATABASE_URL / REDIS / ffmpeg）。
      # BILLING_BASE_URL 也不需要：服务自己 envOr("BILLING_PORT", "8093")，
      # 下面 smoke 步骤直接 curl 8093。
      BILLING_DATABASE_URL: postgresql://ai_assistant_billing:ci-billing-password@127.0.0.1:5434/ai_assistant_billing
      BILLING_TEST_DATABASE_URL: postgresql://ai_assistant_billing:ci-billing-password@127.0.0.1:5434/ai_assistant_billing
      BILLING_INTERNAL_TOKEN: ci-billing-token
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/billing/go.mod
          cache-dependency-path: services/billing/go.sum
      - run: pnpm install --frozen-lockfile
      # 刻意不再跑 pnpm typecheck / pnpm test --force：同一个 commit 在 main 上已经
      # 被 ci.yml 跑过（见文件顶部「tag 只打绿灯 commit」的约定），再跑一遍只是花
      # 双倍额度买同一个结论。跟着一起删的是 Install ffmpeg 和 prisma migrate
      # deploy —— 那两步只为 pnpm test 存在（ffmpeg 决定 8 个用例是真跑还是静默跳）。
      #
      # 留下 pnpm build 是因为 ci.yml 里没有 build 步骤，全仓只有这里会真的过一遍
      # vite / electron 打包。代价写明：**打不出包这件事从此只在打 tag 时才暴露**。
      # 想在 push 阶段就拦住，得往 ci.yml 加 build，那是每次 push 再多几分钟。
      - run: pnpm build
      - run: go test ./...
        working-directory: services/billing
      - name: Smoke test Billing service
        working-directory: services/billing
        run: |
          go run . >/tmp/billing.log 2>&1 &
          billing_pid=$!
          trap 'kill "$billing_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8093/health; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/billing.log
          exit 1

  images:
    # 原来这里有 `if: github.event_name != 'pull_request'`，是为了让 PR 只验证不
    # 发布。现在触发条件里已经没有 pull_request，这个判断恒为真，删掉免得误读成
    # 「还有某种情况不发布」。
    needs: verify
    runs-on: ubuntu-latest
    # 每个镜像走三条路之一，判定在下面的 Resolve source hash 那步：
    #   1. TCR 上已经有 :src-<内容哈希> ⇒ imagetools create 在 registry 内部复制出
    #      :<sha>，只传一份 manifest，十秒级完事，连 dockerd 都不用重启。
    #   2. 没有 ⇒ 正常 build（读 main 上预热好的 gha 缓存，见 warm-image-cache.yml），
    #      再 push；只有没命中缓存的那几层会真的过出境管子。
    #   3. 查不动（网络抖、凭据不对、任何非零退出）⇒ 一律当成「没有」，走第 2 条。
    # 绕这一圈是因为发布慢的根本不是构建，而是「把已经在 TCR 里的字节再传一遍」：
    # runner 出境到国内实测只有 0.15~0.40 MB/s，api 镜像 462 MB 就是 19~51 分钟。
    # gateway（前端静态产物）和 billing（Go）平时几乎不变，第 1 条路主要是给它们省的。
    #
    # 115 分钟 > 单趟 95m 推送窗口 + 冷缓存构建的十几分钟。上限是按「实测出境速率」倒推的，
    # 不是拍的：2026-09-02 的带宽探测（probe-egress.yml）显示 runner→国内只有 0.16 MB/s
    # 量级，v0.1.2 的实测区间是 0.15~0.40 MB/s。所以短窗口是「物理上不够」，不是网络故障。
    timeout-minutes: 115
    strategy:
      max-parallel: 1
      # fail-fast: false 是必须的。默认 true 时 api 一失败，还在 queued 的 migrate/
      # billing/gateway 会被连带取消 —— 但这四个镜像互不依赖，而且推送是**累积**的：
      # 每个成功落地的层都留在 TCR 里，下次重跑直接跳过。把它们一起取消等于白白放弃
      # 三个小镜像本来能推完的进度。v0.1.3 就是这样只推了 api 一个就整轮报废。
      fail-fast: false
      matrix:
        # name / context / file / build_args 必须跟 warm-image-cache.yml 的 matrix 逐字
        # 一致——那边预热出来的 gha 缓存键就是按这四项算的，差一个字就是静默不命中。
        # hash_paths 是本工作流独有的（预热不需要它），warm 那边没这一项不算不一致。
        #
        # hash_paths = 「这个镜像的内容由哪些文件决定」，逐个从 Dockerfile 里真实的 COPY
        # 源头倒推，外加 Dockerfile 本身和 .dockerignore（它决定构建上下文里到底有什么）。
        # 这份集合宁可写宽不能写窄：**写宽只是白构建一次（慢），写窄是把旧代码发上生产
        # （静默事故）**。所以 api 直接把整个 packages/ 算进去，而不是去挑它 import 了哪几个包。
        # 同理，被 .dockerignore 排掉的文件（**/*.test.ts、docs/ 等）也照样算进 hash：改一个
        # 测试文件会白重建一次，但那次构建出来的层内容跟 TCR 上的完全一样（那些文件根本没进
        # 构建上下文），digest 不变 ⇒ Layer already exists ⇒ 出境仍然是 0 字节，只亏构建分钟。
        #
        # 已知不在集合里、因此不会触发重建的东西：基础镜像。node:24-bookworm-slim 和
        # gcr.io/distroless/static-debian12:nonroot 是按 tag 引的（不是 digest），上游重推
        # 同名 tag 时本机制察觉不到，会继续复用旧镜像。要强制重建就动集合里任何一个文件，
        # 或者去 TCR 上删掉那个 src-<hash> tag。（ffmpeg 那个是 digest 钉死的，不受影响。）
        include:
          - name: api
            context: .
            file: infra/docker/api/Dockerfile
            build_args: |
              USE_CHINA_APT_MIRROR=false
              NPM_CONFIG_REGISTRY=https://registry.npmjs.org
              PRISMA_ENGINES_MIRROR=https://binaries.prisma.sh
            # 对应 Dockerfile 第 34-42、50-52 行的 COPY。packages/ 整个进来：api 是
            # `pnpm deploy` 把 workspace 依赖打包进 node_modules 的，挑包等于赌 import 图。
            hash_paths: |
              apps/api
              packages
              pnpm-lock.yaml
              pnpm-workspace.yaml
              package.json
              tsconfig.base.json
              infra/docker/api/Dockerfile
              .dockerignore
          - name: billing
            context: services/billing
            file: infra/docker/billing/Dockerfile
            build_args: ""
            # 构建上下文就是 services/billing，Dockerfile 里是 `COPY . .`，整个目录都算。
            # 不列 .dockerignore：docker 只认 <上下文>/.dockerignore，仓库根那个对它不生效
            # （services/billing/ 下也确实没有这个文件）。
            hash_paths: |
              services/billing
              infra/docker/billing/Dockerfile
          - name: migrate
            context: .
            file: infra/docker/migrate/Dockerfile
            build_args: |
              USE_CHINA_APT_MIRROR=false
              NPM_CONFIG_REGISTRY=https://registry.npmjs.org
              PRISMA_ENGINES_MIRROR=https://binaries.prisma.sh
            # 全镜像只有一条业务 COPY（Dockerfile 第 35 行 packages/db/prisma）。
            # 刻意不含 pnpm-lock.yaml：这个镜像不跑 pnpm，prisma 版本是第 30 行
            # `npm i prisma@6.19.3` 写死的字面量，而 Dockerfile 自己在集合里。
            hash_paths: |
              packages/db/prisma
              infra/docker/migrate/Dockerfile
              .dockerignore
          - name: gateway
            context: .
            file: infra/docker/gateway/Dockerfile
            build_args: ""
            # 对应 Dockerfile 第 6-10、15-19、23 行的 COPY。只有 web/admin 两个 app 加上
            # 它们 package.json 里 workspace:* 引到的 article-workflow / novel-workflow
            # （已核对：这两个 app 没有别的 workspace 依赖）——别的包根本不在构建上下文里。
            hash_paths: |
              apps/web
              apps/admin
              packages/article-workflow
              packages/novel-workflow
              pnpm-lock.yaml
              pnpm-workspace.yaml
              package.json
              tsconfig.base.json
              turbo.json
              infra/caddy/Caddyfile
              infra/docker/gateway/Dockerfile
              .dockerignore
    steps:
      - uses: actions/checkout@v4
      # 登录挪到最前面（原来排在 setup-buildx 后面）：紧接着的 Resolve source hash 要查
      # TCR 上有没有现成镜像，得先有凭据。imagetools 直接说 registry 的 HTTP 协议、不经过
      # dockerd，所以它排在「重启 docker」前面反而更稳；凭据落在 ~/.docker/config.json，
      # 是客户端文件，下面重启 dockerd 不会把它冲掉。
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Resolve source hash
        id: src
        env:
          IMAGE_REPO: ${{ secrets.REGISTRY }}/${{ secrets.IMAGE_NAMESPACE }}/ai-assistant-${{ matrix.name }}
          # SPEC 一起进 hash：context / file / build_args 一变镜像内容就会变，可这三样
          # 在任何文件里都找不到，只写在上面那份 matrix 里。PATHS 自己也进 hash——以后谁改了
          # 路径集合，旧 hash 自动失效，不会拿一个「按旧规则算出来的」镜像顶上。
          # 都走 env 而不是把 ${{ }} 直接拼进 run 脚本：拼进去是文本替换，多行值会把脚本撑坏。
          SPEC: ${{ matrix.name }}|${{ matrix.context }}|${{ matrix.file }}|${{ matrix.build_args }}
          PATHS: ${{ matrix.hash_paths }}
        run: |
          set -uo pipefail
          # 用 git ls-files -s 而不是 find + sha256sum：它输出「mode blob stage path」，其中
          # blob 就是 git 的内容哈希——不含 mtime、不含构建时刻、按路径排序稳定，换一台 runner
          # 也算得出同一个值。checkout 出来的工作区是干净的，索引内容 = 这个 tag 的内容。
          # read 循环而不是 mapfile：pathspec 要按行切开，且不能被 shell 当 glob 展开。
          specs=()
          while IFS= read -r line; do
            [ -n "$line" ] && specs+=("$line")
          done < <(printf '%s\n' "$PATHS")
          if [ "${#specs[@]}" -eq 0 ]; then
            echo "::error::hash_paths 是空的"
            exit 1
          fi
          tree=$(git ls-files -s -- "${specs[@]}")
          # 一个文件都没匹配到只可能是集合写错了（路径改名或被删）。这时候宁可让发布红，也不能
          # 算出一个「所有 commit 都一样」的 hash——那会让之后每次发布都复用第一次那个镜像。
          if [ -z "$tree" ]; then
            echo "::error::hash_paths 没匹配到任何文件，集合写错了"
            exit 1
          fi
          hash=$(printf '%s\n%s\n%s\n' "$SPEC" "$PATHS" "$tree" | sha256sum | cut -c1-16)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "参与计算 $(printf '%s\n' "$tree" | wc -l) 个文件，hash=$hash"
          # 查得到就复用；查不到——404、网络抖、凭据不对，任何非零退出——都当作没有，重新构建。
          # 「判断不准时一律重新构建」：多构建一次只是慢，少构建一次是把旧代码发上生产。
          # 这里用的 buildx 是 runner 自带的 CLI 插件，imagetools 只说 registry 的 HTTP 协议、
          # 不需要 builder 实例，所以排在 setup-buildx 之前也能跑。
          if docker buildx imagetools inspect "$IMAGE_REPO:src-$hash" >/dev/null 2>&1; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "TCR 上已有同源镜像，跳过构建与推送"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "TCR 上没有 src-$hash，走完整构建"
          fi
      - name: Reuse identical image already in TCR
        if: steps.src.outputs.hit == 'true'
        env:
          IMAGE_REF: ${{ secrets.REGISTRY }}/${{ secrets.IMAGE_NAMESPACE }}/ai-assistant-${{ matrix.name }}:${{ github.sha }}
          SRC_REF: ${{ secrets.REGISTRY }}/${{ secrets.IMAGE_NAMESPACE }}/ai-assistant-${{ matrix.name }}:src-${{ steps.src.outputs.hash }}
        run: |
          # registry 内部复制 manifest。源和目标在同一个仓库、层已经在那儿了，所以这一步只
          # PUT 一份 manifest（几 KB），不碰那根 0.15~0.40 MB/s 的出境管子——这才是 P3 省下的
          # 东西：不是「少构建」，是「少传」。
          #
          # 为什么必须做这一步而不是干脆跳过整个 job：deploy 用的引用是 <sha> 那个 tag，
          # 它不存在的话 compose pull 直接失败。「跳过构建」不等于「跳过打 tag」。
          docker buildx imagetools create -t "$IMAGE_REF" "$SRC_REF"
      - name: Limit concurrent registry uploads
        # 命中跳过时这一步没意义（不推任何层），而它要重启 dockerd，白花二十来秒。
        if: steps.src.outputs.hit != 'true'
        # 并发回到 1。出境是一根被限到 0.16 MB/s 量级的管子，并发只是把它切成 N 份，
        # 结果谁都跑不完一整层：v0.1.1（并发 1）推完 8/11 层，v0.1.2（并发 3）反而只
        # 推完 6/11、attempt 1 一层都没落地。限速链路上，串行才能把层一个个「存档」。
        run: |
          daemon_config="$(mktemp)"
          if sudo test -f /etc/docker/daemon.json; then
            sudo cat /etc/docker/daemon.json \
              | jq '. + {"max-concurrent-uploads": 1}' > "$daemon_config"
          else
            jq -n '{"max-concurrent-uploads": 1}' > "$daemon_config"
          fi
          sudo install -m 0644 "$daemon_config" /etc/docker/daemon.json
          sudo systemctl restart docker
      - uses: docker/setup-buildx-action@v3
        if: steps.src.outputs.hit != 'true'
      - uses: docker/build-push-action@v6
        if: steps.src.outputs.hit != 'true'
        env:
          # 可复现构建（P4）。为什么必须是常量 0 而不是 docker 文档推荐的 `git log -1 %ct`：
          # 用提交时间就等于每个 commit 一个时间戳，层的 mtime 又变了，正好把这件事的意义抹掉。
          # 代价是镜像的 created 显示 1970-01-01，本仓没有任何东西读它。
          SOURCE_DATE_EPOCH: "0"
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build_args }}
          # 这里原来是 `load: true`。换成等价的 outputs 写法只为了能多带一个 exporter 选项，
          # 「build 到本地 → 单独 docker push」的结构一点没动（type=docker 且不带 dest 就是
          # --load 的定义）：那个结构是限速链路上唯一能把已上传的层累积下来的机制。
          #
          # rewrite-timestamp=true 把层里的文件 mtime 全部改写成 SOURCE_DATE_EPOCH。
          # 没有它的话，同样的内容重新构建一次也会得到新的 digest（实测：同一个 Dockerfile
          # 连续两次 --no-cache 构建，最后一层 diffID 不同），TCR 就不认 Layer already
          # exists，于是 gha 缓存一失效（7 天不用会被清、仓库总量 10 GB 也会 LRU 淘汰）
          # 就要把 apt / node_modules 那两百多 MB 重传一遍。加上它之后两次构建的 6 层
          # diffID 与 config digest 全部逐字相同（本机实测，含 docker load 之后再比一次）。
          #
          # provenance / sbom 关掉：attestation 走不进 docker load 这条路（dockerd 里只有
          # 单平台镜像），算了也是白算，还会多出一个自带时间戳的 manifest。
          outputs: type=docker,rewrite-timestamp=true
          provenance: false
          sbom: false
          # 两个 tag 指向同一个 image id：`:<sha>` 是 deploy 用的（remote-deploy.sh 收的就是
          # 它），`:src-<hash>` 是给「下次发布」留的路标。层是共享的，多这一个 tag 只多推一份
          # manifest（几 KB），换来的是下次同源发布一个字节都不用传。
          tags: |
            ${{ secrets.REGISTRY }}/${{ secrets.IMAGE_NAMESPACE }}/ai-assistant-${{ matrix.name }}:${{ github.sha }}
            ${{ secrets.REGISTRY }}/${{ secrets.IMAGE_NAMESPACE }}/ai-assistant-${{ matrix.name }}:src-${{ steps.src.outputs.hash }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Push image to TCR
        if: steps.src.outputs.hit != 'true'
        env:
          IMAGE_REF: ${{ secrets.REGISTRY }}/${{ secrets.IMAGE_NAMESPACE }}/ai-assistant-${{ matrix.name }}:${{ github.sha }}
          SRC_REF: ${{ secrets.REGISTRY }}/${{ secrets.IMAGE_NAMESPACE }}/ai-assistant-${{ matrix.name }}:src-${{ steps.src.outputs.hash }}
        run: |
          # 单趟窗口 95m，不再切成 3 × 35m。
          #
          # 为什么改：内容寻址的层复用是按「层」而不是按「字节」的 —— 一次 docker push 被
          # timeout 砍掉时，正在传输的那一层进度全部作废，只有已经 PUT 完成的层才留在 TCR。
          # 而 462 MB 按实测的 0.15~0.22 MB/s 单趟就需要 35~51 分钟，比 35m 的窗口还长，
          # 于是每一次尝试都在最大的那层（195.88 MB，单层就要 15~22 分钟）上被砍，三次尝试
          # 一层都没跨过去。v0.1.3 的 images (api) 就是这么烧掉 115 分钟零产出的。
          # 「切小窗口多试几次」在限速链路上是反作用力，一趟推到底才对。
          #
          # 重试只留给「快速失败」（连接被断、token 过期这类）。跑满窗口说明是带宽不够，
          # 再试一次是同样的结果，不如直接失败：同一个 ref 上 `gh run rerun --failed` 能读到
          # 这次 build 写进 gha 缓存的层，digest 一致，已经上传的层会被判 Layer already
          # exists，于是重跑是**续跑**而不是重来。跨 ref 就没有这个性质（gha 缓存按 ref 隔离，
          # tag 之间互相读不到），所以别为了续跑去新打一个 tag。
          attempt=1
          pushed=0
          while :; do
            started=$(date +%s)
            if timeout --signal=TERM 95m docker push "$IMAGE_REF"; then
              pushed=1
              break
            fi
            elapsed=$(( $(date +%s) - started ))
            if [ "$elapsed" -ge 5400 ] || [ "$attempt" -ge 3 ]; then
              echo "::error::推送未在窗口内完成（本次耗时 ${elapsed}s）。已落地的层留在 TCR，" \
                   "对同一个 run 执行 gh run rerun --failed 可续传剩余层。"
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep $((attempt * 15))
          done
          # 成功路径原来是 `exit 0`，改成 pushed=1 + break，好接着推 src tag——窗口、重试
          # 次数、退避、失败判定一个都没动。
          if [ "$pushed" -ne 1 ]; then exit 1; fi
          # 层刚才已经全部落地，这里只是给同一个 image id 再提交一份 manifest（几 KB）。
          # 它失败不该让发布挂：后果仅仅是下次发布查不到这个 hash，多构建一次而已。
          docker push "$SRC_REF" || echo "::warning::src tag 推送失败，下次发布会重新构建这个镜像"

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Upload deployment manifests
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
        run: |
          ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_ROOT/infra/caddy'"
          scp -P "${DEPLOY_PORT:-22}" docker-compose.prod.yml scripts/remote-deploy.sh scripts/rollback-compose.sh scripts/profile-resources.sh scripts/install-host-caddy.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/"
          scp -P "${DEPLOY_PORT:-22}" infra/caddy/ai-assistant.caddy "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/infra/caddy/"
      - name: Deploy verified image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
        run: |
          ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_ROOT='$DEPLOY_ROOT' bash '$DEPLOY_ROOT/remote-deploy.sh' '${{ github.sha }}'"
