name: Release to production

on:
  # 只在手动触发时跑，且只允许从 main 触发。做法与 blog
  # （/Users/z/code/blog/.github/workflows/deploy.yml）一致。
  #
  # 为什么不再用 tag push（2026-10-13 改）：GitHub 的 Actions 缓存按 github.ref 隔离，
  # 官方文档写得很直白 ——「一个为 tag release-a 创建的缓存，对由 tag release-b 触发的
  # 工作流不可用」。每次发布打一个新 tag 就等于每次都换一个 ref，构建缓存永远命中不了。
  # 改成 dispatch on main 之后 ref 恒为 refs/heads/main，缓存才可能跨次复用。blog 就是
  # 靠这一点：它的 deploy 走 workflow_dispatch，所以 type=gha 缓存从来没冷过。
  #
  # 代价写明：tag 不再是发布动作，只是提交上的书签；发出去的是 main 的 HEAD。
  # 要让「tag 和线上版本」对齐，就先打 tag、再点发布，中间别往 main 合东西。
  #
  # 附一条不能回去的历史：最早这里是「push 到 main 就跑」，一次 push 约 50 个计费分钟，
  # 2026-08 在 08-27 把 Free 计划的 2000 分钟用光，之后每个 job 都以
  # 「The job was not started because ... spending limit」直接不启动，连着红了三天。
  workflow_dispatch:

permissions:
  contents: read
  # verify-release 要调 listWorkflowRuns 查 ci.yml 的历史结论。
  # 没有 packages: write —— 镜像推到的是腾讯云 TCR（用 secrets 里的账号密码登录），
  # 不是 GHCR，这个权限整个工作流没人用。
  actions: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  verify-release:
    name: 这次发布是否合法
    runs-on: ubuntu-latest
    # 只有一个 API 调用，5 分钟是防卡死的上限，正常几秒。
    timeout-minutes: 5
    steps:
      # 不 checkout：下面两步都不需要工作区，省掉一次克隆和一次 git fetch。
      # （2026-10-13 之前这里要 fetch-depth: 0 去判「tag 是不是 origin/main 的祖先」，
      # 改成 dispatch on main 之后那个判断恒真，整段删了。）
      - name: 只允许从 main 发布
        # workflow_dispatch 可以对着任意分支或 tag 点，所以这道守卫不能省。
        # 判据用完整的 github.ref，不用 github.ref_name：分支名和 tag 名共用一个命名空间，
        # 一个**名字恰好叫 main 的 tag**（refs/tags/main）能让 ref_name 判断放行。
        # github.ref 带 refs/heads 或 refs/tags 前缀，没有这个歧义。
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::生产发布只能从 main 这个分支触发，当前是 ${{ github.ref }}" >&2
          exit 1
      - name: 该提交必须有一次成功的 CI
        # 「只发绿灯 commit」这条约定的强制实现。不要退回到只写在注释里的口头约定 ——
        # 那样链路上就没有任何校验点，一次误操作就能把没跑过测试的提交发到生产。
        # github-script 需要 workflow 顶部的 permissions: actions: read。
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              head_sha: context.sha,
              status: 'completed',
              per_page: 100,
            });
            const passed = data.workflow_runs.filter((run) => run.conclusion === 'success');
            if (passed.length === 0) {
              core.setFailed(`没有找到 ${context.sha} 的成功 CI 记录，拒绝发布`);
              return;
            }
            core.info(`找到 ${passed.length} 次成功的 CI，通过`);

  images:
    name: 构建并推送 ${{ matrix.name }}
    needs: verify-release
    # 2026-10-13 从自建 Mac runner 换到 ubuntu-latest。换的前提是上面把触发改成了
    # dispatch on main —— 缓存 scope 才不会再随 tag 漂移，type=gha 才可能命中。
    # 顺带拿到三件事：原生 linux/amd64（Mac 上是 Rosetta 模拟）、三个镜像各自一台机器
    # 可以真并行、以及不再要求「发布时那台 Mac 必须醒着且 Docker Desktop 在跑」。
    # aiproject 是公开仓库，标准托管 runner 不占免费额度。
    runs-on: ubuntu-latest
    # 每个镜像只有两条路，判定在下面的「这个提交已经推过了就跳过」这步：
    #   1. TCR 上已经有 :<sha> ⇒ 整个构建与推送跳过（让 `gh run rerun` 天然幂等）。
    #   2. 没有 ⇒ build 出 amd64 镜像，再把本地镜像归档交给 regctl 按 4 MiB 分块 push TCR。
    #
    # 为什么还留着 regctl 而不是像 blog 那样直接用 build-push-action 的 push：
    # blog 那两个镜像每次真正新增的字节只有几 MB，裸 docker push 赌得起。这里 api 是
    # 200 MB 量级，而这条出境链路实测极不稳定 —— 同一批镜像推 TCR 的耗时在
    # 3.2s ~ 376.8s 之间抖（差 100 倍，最慢那次日志里没有任何逐层进度，是卡死不是匀速慢）。
    # 裸 push 是一次长 PUT，被切断就从该层的 0 字节重来；regctl 切成 4 MiB 小块，
    # 断线只重试当前小块。换 runner 和换推送机制不要同时做，否则出问题分不清是谁的锅。
    #
    # 2026-10 删掉了旧的 :src-<内容哈希> 内容寻址机制（它当时是「第 1 条路」）。理由是它和
    # 已有的层复用机制重叠：原注释里自己写着「digest 不变 ⇒ Layer already exists ⇒ 出境 0 字节」，
    # 也就是「没变的层本来就不会重传」，内容哈希额外省的只是「Mac 本地构建缓存冷掉」
    # 这一种罕见情况；而它的代价是一份**手工维护**的 hash_paths —— 写窄了不会报错，
    # 只会静默把旧代码发上生产。收益窄、风险专一，故删。
    #
    # 从 Mac 换过来之后少掉的是一台机器上累积的 28.8 GB BuildKit 缓存，所以这里必须
    # 显式声明 type=gha，否则每次发布都是冷构建。缓存 scope 用镜像名，三个镜像互不覆盖。
    # mode=max 会把 builder 阶段的中间层（apt、pnpm install）也存进去，这是必要的：
    # 只缓存最终镜像的层（mode=min）解决不了最贵的那步 pnpm install。
    timeout-minutes: 60
    strategy:
      # fail-fast: false 是必须的。默认 true 时 api 一失败，还在 queued 的 migrate/
      # gateway 会被连带取消 —— 但这三个镜像互不依赖，而且推送是**累积**的：
      # 每个成功落地的层都留在 TCR 里，下次重跑直接跳过。把它们一起取消等于白白放弃
      # 两个小镜像本来能推完的进度。v0.1.3 就是这样只推了 api 一个就整轮报废。
      fail-fast: false
      matrix:
        # 下面是「每个镜像的内容由哪些文件决定」的文档，**不再参与任何哈希计算**
        # （2026-10 删掉了内容寻址机制，只留这份注释，方便判断一次改动会波及哪个镜像）：
        #   api     ← apps/api、packages/ 整个（不挑包：api 用 pnpm deploy 把 workspace
        #             依赖打进 node_modules，挑包等于赌 import 图）
        #   migrate ← packages/db/prisma（全镜像只有这一条业务 COPY）
        #   gateway ← apps/web、apps/admin、它们 workspace:* 引到的 article-workflow /
        #             novel-workflow，以及 infra/caddy/Caddyfile
        #
        # 两条与「重传」有关的既有事实，仍然生效：
        #  · Dockerfile 已把「易变的源码」与「稳定的 node_modules」分成两条 COPY，所以改
        #    源码只重传小的那层；没变的层 digest 不变，TCR 直接判 Layer already exists ⇒
        #    出境 0 字节。这也是删掉内容寻址后仍然不会重复传的原因。
        #  · 基础镜像 node:24-bookworm-slim / gcr.io/distroless/static-debian12:nonroot 是按
        #    tag 引的（不是 digest），上游重推同名 tag 时察觉不到，会继续复用旧镜像。
        #    要强制重建就动 Dockerfile，或清掉 TCR 上对应的 tag。
        include:
          - name: api
            file: infra/docker/api/Dockerfile
            build_args: |
              USE_CHINA_APT_MIRROR=true
              NPM_CONFIG_REGISTRY=https://registry.npmmirror.com
              PRISMA_ENGINES_MIRROR=https://registry.npmmirror.com/-/binary/prisma
          - name: migrate
            file: infra/docker/migrate/Dockerfile
            build_args: |
              USE_CHINA_APT_MIRROR=true
              NPM_CONFIG_REGISTRY=https://registry.npmmirror.com
              PRISMA_ENGINES_MIRROR=https://registry.npmmirror.com/-/binary/prisma
          - name: gateway
            file: infra/docker/gateway/Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@v4
      # 换到托管 runner 之后，Mac 上那两步手写的准备全都不需要了：
      # DOCKER_CONFIG / jq 拼 auths / 软链 cli-plugins / 查 Rosetta 支持 amd64，
      # 当初都是为了让 launchd 起的 runner 绕过 macOS Keychain 交互授权。
      # ubuntu 上就是标准两步。
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: 这个提交已经推过了就跳过
        id: skip
        env:
          IMAGE_REF: ${{ secrets.REGISTRY }}/${{ secrets.IMAGE_NAMESPACE }}/ai-assistant-${{ matrix.name }}:${{ github.sha }}
        run: |
          set -uo pipefail
          # imagetools 只走 registry 的 HTTP 协议、不需要 builder 实例，排在哪一步都可以；
          # 放这里是因为前面已经 login 过了，查私有仓库要凭据。
          # 查得到就跳过；查不到 —— 404、网络抖、凭据不对、任何非零退出 —— 一律当作没有，
          # 重新构建。「判断不准时一律重新构建」：多构建一次只是慢，少构建一次是把旧代码漏发。
          #
          # 平时不会命中（同一个 commit 不会发两次），留着是为了两件事：
          #   1. 出境被限速的这段时间里，镜像可以在别处构建好直接推到 TCR（本机就行，不占
          #      生产机、不多开机器）。推完再跑本工作流，images 整段空转，只剩 deploy 做事。
          #      没有这条判断，workflow 会把同一个镜像原样重传一遍 —— api 约 200 MB，
          #      按这条链路实测的速率就是几分钟到几十分钟白烧。
          #   2. `gh run rerun` 天然幂等：上一次已经推成功的镜像不再重传。
          if docker buildx imagetools inspect "$IMAGE_REF" >/dev/null 2>&1; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "TCR 上已经有 $IMAGE_REF，构建与推送整段跳过"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "TCR 上没有 $IMAGE_REF，走完整构建"
          fi
      - name: 构建镜像
        if: steps.skip.outputs.hit != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          build-args: ${{ matrix.build_args }}
          # 镜像先 load 进 runner 的 docker daemon，再由下一步交给 regctl 推。
          # 不用 build-push-action 自带的 push 是为了保留 4 MiB 分块重试，理由见本 job 顶部。
          # 失败重跑时这一步能吃 gha 缓存，而 TCR 那边已经收下的层不用重传。
          load: true
          provenance: false
          sbom: false
          # 缓存必须显式声明：托管 runner 每次都是全新实例，没有任何跨次活着的构建缓存
          # （Mac 上那 28.8 GB BuildKit 缓存换过来就没了）。
          # scope 按镜像名分开，三个镜像互不覆盖。
          # mode=max：连 builder 阶段的中间层一起存。只存最终镜像的层（mode=min）解决不了
          # 最贵的 pnpm install —— api 的 node_modules 解压后 459 MiB，是这一步的主要成本。
          # 仓库有 10 GB 缓存上限，三个 scope 加起来仍在限额内。
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # 只打 :<sha> 一个 tag —— deploy 用的就是它（remote-deploy.sh 收的正是这个值）。
          # 原来那个 :src-<hash>「路标 tag」随内容寻址机制一起删了，理由见本 job 顶部注释。
          tags: ${{ secrets.REGISTRY }}/${{ secrets.IMAGE_NAMESPACE }}/ai-assistant-${{ matrix.name }}:${{ github.sha }}
      - name: 分块推送到 TCR
        if: steps.skip.outputs.hit != 'true'
        env:
          IMAGE_NAME: ${{ matrix.name }}
          IMAGE_REF: ${{ secrets.REGISTRY }}/${{ secrets.IMAGE_NAMESPACE }}/ai-assistant-${{ matrix.name }}:${{ github.sha }}
          REGISTRY: ${{ secrets.REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail

          # Docker push 会把整个压缩层放进一次长 PUT。当初在 Mac 直连 TCR 时实测同一连接
          # 传到 36.3 MB 后被中断，下一次只能从该层的 0 字节重新开始；换到 ubuntu 之后
          # 链条换成「GitHub 托管 → TCR」，但 blog 的实测证明这条出境链路一样会卡
          # （同一批镜像的推层耗时在 3.2s ~ 376.8s 之间抖）。所以这里继续用 regctl：
          # 导入 docker save 归档时走 Registry V2 PATCH，把大层切成 4 MiB 小块，断线只重试
          # 当前小块。固定版本和 SHA-256，避免发布机每次拿到未经验证的 latest 二进制。
          regctl_version=v0.11.6
          # linux-amd64（换 runner 时从 darwin-arm64 换过来，哈希重新核对过）。
          # 拿法：curl -sL <release>/regctl-linux-amd64 | shasum -a 256
          regctl_sha256=8e0e62a497fcdb8048d18aa927a139613176ba0531f412bc541044e28f9856bd
          temp_dir=$(mktemp -d "$RUNNER_TEMP/regctl-${IMAGE_NAME}.XXXXXX")
          trap 'rm -rf "$temp_dir"' EXIT
          regctl="$temp_dir/regctl"
          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --connect-timeout 15 --max-time 180 \
            "https://github.com/regclient/regclient/releases/download/${regctl_version}/regctl-linux-amd64" \
            --output "$regctl"
          printf '%s  %s\n' "$regctl_sha256" "$regctl" | sha256sum -c -
          chmod 700 "$regctl"

          export REGCTL_CONFIG="$temp_dir/config.json"
          "$regctl" registry set "$REGISTRY" \
            --blob-chunk 4194304 \
            --blob-max 4194304 \
            --req-concurrent 1 \
            --skip-check
          printf '%s' "$REGISTRY_PASSWORD" \
            | "$regctl" registry login "$REGISTRY" \
                --user "$REGISTRY_USERNAME" --pass-stdin

          archive="$temp_dir/image.tar"
          docker save "$IMAGE_REF" --output "$archive"
          echo "本地镜像归档大小：$(du -h "$archive" | awk '{print $1}')"
          "$regctl" --verbosity debug image import "$IMAGE_REF" "$archive"
          echo "TCR 已写入 $IMAGE_REF ($("$regctl" image digest "$IMAGE_REF"))"

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Upload deployment manifests
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
        run: |
          ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_ROOT/infra/caddy'"
          scp -P "${DEPLOY_PORT:-22}" docker-compose.prod.yml scripts/remote-deploy.sh scripts/rollback-compose.sh scripts/profile-resources.sh scripts/install-host-caddy.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/"
          scp -P "${DEPLOY_PORT:-22}" infra/caddy/ai-assistant.caddy "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/infra/caddy/"
      - name: Deploy verified image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
        run: |
          ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_ROOT='$DEPLOY_ROOT' bash '$DEPLOY_ROOT/remote-deploy.sh' '${{ github.sha }}'"
