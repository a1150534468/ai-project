name: Verify and deploy production

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ai-assistant
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: ai-assistant
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U ai-assistant -d ai-assistant"
          --health-interval 5s --health-timeout 5s --health-retries 20
      billing-postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ai_assistant_billing
          POSTGRES_PASSWORD: ci-billing-password
          POSTGRES_DB: ai_assistant_billing
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U ai_assistant_billing -d ai_assistant_billing"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://ai-assistant:ci-postgres-password@127.0.0.1:5433/ai-assistant
      BILLING_DATABASE_URL: postgresql://ai_assistant_billing:ci-billing-password@127.0.0.1:5434/ai_assistant_billing
      BILLING_TEST_DATABASE_URL: postgresql://ai_assistant_billing:ci-billing-password@127.0.0.1:5434/ai_assistant_billing
      BILLING_BASE_URL: http://127.0.0.1:8093
      BILLING_INTERNAL_TOKEN: ci-billing-token
      REDIS_URL: redis://127.0.0.1:6380
      SESSION_SECRET: ci-session-secret-with-at-least-32-characters
      ADMIN_SESSION_SECRET: ci-admin-secret-with-at-least-32-characters
      CODEX_PET_ARTIFACT_SIGNING_SECRET: ci-codex-pet-signing-secret-long-enough
      LLM_BASE_URL: http://127.0.0.1:9
      LLM_API_KEY: ci-placeholder-not-a-real-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/billing/go.mod
          cache-dependency-path: services/billing/go.sum
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ai-assistant/db exec prisma migrate deploy
      - run: pnpm typecheck
      - run: pnpm test --force
      - run: pnpm build
      - run: go test ./...
        working-directory: services/billing
      - name: Smoke test Billing service
        working-directory: services/billing
        run: |
          go run . >/tmp/billing.log 2>&1 &
          billing_pid=$!
          trap 'kill "$billing_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8093/health; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/billing.log
          exit 1

  images:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: .
            file: infra/docker/api/Dockerfile
          - name: gateway
            context: .
            file: infra/docker/gateway/Dockerfile
          - name: migrate
            context: .
            file: infra/docker/migrate/Dockerfile
          - name: billing
            context: services/billing
            file: infra/docker/billing/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ secrets.REGISTRY }}/${{ secrets.IMAGE_NAMESPACE }}/ai-assistant-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Upload deployment manifests
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
        run: |
          ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_ROOT/infra/caddy'"
          scp -P "${DEPLOY_PORT:-22}" docker-compose.prod.yml scripts/remote-deploy.sh scripts/rollback-compose.sh scripts/profile-resources.sh scripts/install-host-caddy.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/"
          scp -P "${DEPLOY_PORT:-22}" infra/caddy/ai-assistant.caddy "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_ROOT/infra/caddy/"
      - name: Deploy verified image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
        run: |
          ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_ROOT='$DEPLOY_ROOT' bash '$DEPLOY_ROOT/remote-deploy.sh' '${{ github.sha }}'"
