name: Warm image build cache

# 手动灾备工具：把 3 个镜像的 buildx 层缓存写进 gha。正常发布已改用
# 专用 Mac Runner 的持久 Docker Desktop BuildKit 缓存，不再为每次 main 变更消耗
# GitHub Hosted Runner 分钟。只在需要重建远端灾备缓存时手动触发。
#
# 为什么非得在 main 上写：**GitHub Actions 缓存是按 ref 隔离的——任何 ref 都能读默认
# 分支的缓存，但 tag 之间互相读不到**。production.yml 只在 tag 上跑，它 cache-to 写出去
# 的条目下一个 tag 根本读不到，于是 v0.1.2 的构建日志里 CACHED 出现 0 次、462 MB 一个
# 字节不少地重传。main 上先构建一遍，tag 才有东西可命中。
#
# 命中省下的不是构建时间，是出境字节：buildkit 命中缓存时复用的是同一个 layer blob、
# 同一个 digest，TCR 直接判 Layer already exists。runner 出境到国内实测 0.15~0.40 MB/s
# （probe-egress.yml 的结论），少传 ffmpeg + apt 那 185 MB 就是少 8~20 分钟。
on: workflow_dispatch

concurrency:
  # 缓存只有最新那份有意义，旧的跑一半没必要占额度。跟 ci.yml 相反——那边 main 上每个
  # 提交都要有独立的测试结论，这边只是保温，没有「结论」可言。
  group: warm-image-cache
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warm:
    runs-on: ubuntu-latest
    # 冷缓存下 api 最久（apt + pnpm install + prisma generate + 再一轮 apt）。30 分钟
    # 留足余量，又不至于让卡住的 job 白吃额度——额度按 job 墙钟向上取整计费。
    timeout-minutes: 30
    strategy:
      # 不设 max-parallel: 1。production.yml 设成 1 是因为 3 个 job 抢同一根被限到
      # 0.16 MB/s 的出境管子推 TCR；这里只写 gha 缓存（同机房，不走那根管子），
      # 并行不抢带宽，而并行与串行的计费分钟数是一样的。
      fail-fast: false
      matrix:
        # 这份手动工具保留原 GitHub Hosted Runner 的构建参数，只用于诊断或
        # 将来切回 GHA 缓存方案时预热；正常 production.yml 不再读取这些条目。
        include:
          - name: api
            context: .
            file: infra/docker/api/Dockerfile
            build_args: |
              USE_CHINA_APT_MIRROR=false
              NPM_CONFIG_REGISTRY=https://registry.npmjs.org
              PRISMA_ENGINES_MIRROR=https://binaries.prisma.sh
          - name: migrate
            context: .
            file: infra/docker/migrate/Dockerfile
            build_args: |
              USE_CHINA_APT_MIRROR=false
              NPM_CONFIG_REGISTRY=https://registry.npmjs.org
              PRISMA_ENGINES_MIRROR=https://binaries.prisma.sh
          - name: gateway
            context: .
            file: infra/docker/gateway/Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        env:
          # 跟 production.yml 那边保持一致。SOURCE_DATE_EPOCH 只影响导出、不进层缓存键，
          # 所以这里加不加本来都命中；两边写一样是为了不留「万一它其实进了缓存键」这种
          # 静默不命中的可能——本工作流唯一的产出就是缓存键，赌不起。
          SOURCE_DATE_EPOCH: "0"
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build_args }}
          # cacheonly：只写缓存，不导出镜像。刻意不写 load/push/tags——本工作流没有
          # registry 凭据，也不需要，缓存条目是内容寻址的，tag 那边照样能用。
          outputs: type=cacheonly
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
