# Prisma 迁移 Job：发版时复跑 migrate deploy（含 CREATE EXTENSION vector）。
# 注意：固定名 migrate；release.sh 先 delete 旧 Job 再 apply 新 Job，规避 Job 不可变冲突。
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: ai-assistant
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: image-pull-secret-placeholder
      containers:
        - name: migrate
          image: ai-assistant-migrate
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-assistant-api-secrets
                  key: DATABASE_URL
