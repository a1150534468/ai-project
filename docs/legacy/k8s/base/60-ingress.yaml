# 同源路由：web/admin 前端代码用相对 /api（不走 VITE_API_BASE），故各自域名下 /api 转 api。
# app.example.com   /api → api(8090，不 rewrite，api 服务全 /api/* 路径)  /  → web
# admin.example.com /api → api(8090)                                      /  → admin
# api.example.com   / → api(8090)，桌宠安装深链与签名产物下载的对外入口
# TLS 复用通配证书 app-tls。
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: ai-assistant
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # /api/chat 等 SSE 流式：拉长读写超时
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [app.example.com]
      secretName: app-tls
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: api, port: { number: 8090 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin
  namespace: ai-assistant
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [admin.example.com]
      secretName: app-tls
  rules:
    - host: admin.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: api, port: { number: 8090 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: admin, port: { number: 80 } } }
---
# api.example.com：桌宠对外入口（CODEX_PET_PUBLIC_BASE_URL，安装深链 + /api/public/codex-pets/artifacts 签名下载）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: ai-assistant
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.example.com]
      secretName: app-tls
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: api, port: { number: 8090 } } }
