services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ai-assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-password-placeholder}
      POSTGRES_DB: ai-assistant
    ports: ["5433:5432"]
    volumes: ["ai_assistant_pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6380:6379"]
  billing-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ai_assistant_billing
      POSTGRES_PASSWORD: ${BILLING_POSTGRES_PASSWORD:-billing-postgres-password-placeholder}
      POSTGRES_DB: ai_assistant_billing
    ports: ["5434:5432"]
    volumes: ["ai_assistant_billing_pg:/var/lib/postgresql/data"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio-access-key-placeholder}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-secret-key-placeholder}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
volumes:
  ai_assistant_pg:
  ai_assistant_billing_pg:
  minio-data:
