# 本地开发的数据层：只保留有状态的自建服务。
# 对象存储不再本地起服务——dev 与 prod 连同一个 COS 桶，用 S3_KEY_PREFIX
# （dev/prod）区分文件夹，见 apps/api/src/storage/s3-key.ts。
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ai-assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-password-placeholder}
      POSTGRES_DB: ai-assistant
    ports: ["5433:5432"]
    volumes: ["ai_assistant_pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6380:6379"]
volumes:
  ai_assistant_pg: