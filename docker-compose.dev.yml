# 本地开发的数据层：只保留有状态的自建服务。
# 对象存储不再本地起服务——dev 与 prod 连同一个 COS 桶，用 S3_KEY_PREFIX
# （dev/prod）区分文件夹，见 apps/api/src/storage/s3-key.ts。
#
# app profile 把 5 个 node 进程（api / novel-worker / codex-pet-worker / web /
# admin）也放进 Docker，方案见 docs/plans/2026-10-22-dev-container.md。
# 不带 --profile app 时（pnpm dev:infra、scripts/dev-local.sh），本文件行为
# 与只有 pg/redis 的旧版一致：app profile 服务不会被拉起。
#
# 项目名保持默认 aiproject → 数据卷 aiproject_ai_assistant_pg 不变；
# 本文件任何改动都不要配 `down -v`（会删卷丢数据）。

# 5 个 app 服务 + migrate 共用同一个镜像 ai-assistant-dev:local。
# build 只挂在 migrate 一个服务上：多服务并行 build 会竞争打同一个 tag，
# compose 以 image "already exists" 报错；其余服务仅按 tag 引用该镜像。

# 容器网络内的数据层地址；environment 优先级高于 env_file，
# 覆盖 .env 里指向宿主 localhost:5433/6380 的 DATABASE_URL/REDIS_URL。
x-app-env: &app-env
  DATABASE_URL: postgresql://ai-assistant:${POSTGRES_PASSWORD:-postgres-password-placeholder}@postgres:5432/ai-assistant
  REDIS_URL: redis://redis:6379

# api 与两个 worker 的源码挂载：只挂各包 src，不挂 apps 整棵——
# apps/*/node_modules 是宿主（darwin）的 pnpm 软链，混进容器会 Cannot find module。
x-app-src: &app-src
  - ./apps/api/src:/repo/apps/api/src
  - ./packages/db/src:/repo/packages/db/src
  - ./packages/llm/src:/repo/packages/llm/src
  - ./packages/novel-workflow/src:/repo/packages/novel-workflow/src
  - ./packages/article-workflow/src:/repo/packages/article-workflow/src
  - ./packages/codex-pet-pipeline/src:/repo/packages/codex-pet-pipeline/src

# 与宿主模式 dev-local.sh 的层叠顺序一致：.env 全量基础，.env.local 只覆盖
# 写到的键（QA 覆盖常用），后者覆盖前者同名键。
x-app-env-file: &app-env-file
  - path: .env
  - path: .env.local
    required: false

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ai-assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-password-placeholder}
      POSTGRES_DB: ai-assistant
    # 绑定 127.0.0.1：默认不对宿主以外暴露。需要从 VM/其他设备直连 5433 的
    # 场景自行改回 0.0.0.0 或加映射（评审补充 3）。
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["ai_assistant_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai-assistant -d ai-assistant"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # 一次性迁移服务：迁移失败时 depends_on 会让 api 静默等待而不是带病启动。
  migrate:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/dev/Dockerfile
    image: ai-assistant-dev:local
    working_dir: /repo
    env_file: *app-env-file
    environment: *app-env
    command: pnpm --filter @ai-assistant/db exec prisma migrate deploy
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["app"]
    image: ai-assistant-dev:local
    working_dir: /repo
    init: true
    command: pnpm --filter @ai-assistant/api dev
    ports: ["127.0.0.1:8090:8090"]
    env_file: *app-env-file
    environment:
      <<: *app-env
      PORT: "8090"
    volumes: *app-src
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  novel-worker:
    profiles: ["app"]
    image: ai-assistant-dev:local
    working_dir: /repo
    init: true
    command: pnpm --filter @ai-assistant/api worker:novel:dev
    # 8091/8092 只是各自的健康端口，全仓库无外部引用，不发布不影响功能；
    # 排查用 pnpm dev:docker:logs，确需探活再临时加 127.0.0.1 端口映射（评审补充 2）。
    env_file: *app-env-file
    environment: *app-env
    volumes: *app-src
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  codex-pet-worker:
    profiles: ["app"]
    image: ai-assistant-dev:local
    working_dir: /repo
    init: true
    command: pnpm --filter @ai-assistant/api worker:codex-pet:dev
    env_file: *app-env-file
    environment: *app-env
    volumes: *app-src
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    profiles: ["app"]
    image: ai-assistant-dev:local
    working_dir: /repo
    init: true
    command: sh -c "pnpm --filter @ai-assistant/web dev -- --host 0.0.0.0 --port 5174"
    ports: ["127.0.0.1:5174:5174"]
    environment:
      PORT: "5174"
      API_PROXY_TARGET: http://api:8090 # 容器内直连 api，不走宿主
    volumes:
      - ./apps/web/src:/repo/apps/web/src
      - ./apps/web/index.html:/repo/apps/web/index.html
      - ./apps/web/vite.config.ts:/repo/apps/web/vite.config.ts
      - ./apps/web/tailwind.config.js:/repo/apps/web/tailwind.config.js
      - ./apps/web/postcss.config.js:/repo/apps/web/postcss.config.js
      - ./packages/novel-workflow/src:/repo/packages/novel-workflow/src
      - ./packages/article-workflow/src:/repo/packages/article-workflow/src
    depends_on:
      api:
        condition: service_started

  admin:
    profiles: ["app"]
    image: ai-assistant-dev:local
    working_dir: /repo
    init: true
    command: sh -c "pnpm --filter @ai-assistant/admin dev -- --host 0.0.0.0 --port 5175"
    ports: ["127.0.0.1:5175:5175"]
    environment:
      PORT: "5175"
      API_PROXY_TARGET: http://api:8090
    volumes:
      - ./apps/admin/src:/repo/apps/admin/src
      - ./apps/admin/index.html:/repo/apps/admin/index.html
      - ./apps/admin/vite.config.ts:/repo/apps/admin/vite.config.ts
    depends_on:
      api:
        condition: service_started

volumes:
  ai_assistant_pg:
